<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="16" dy="24" stdDeviation="0" flood-color="#1E1714" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Card Body with Neo-Brutalist Shadow -->
  <rect x="120" y="140" width="784" height="744" rx="140" fill="#FEF08A" stroke="#1E1714" stroke-width="28" filter="url(#shadow)" />

  <!-- Top Clip / Tab (Mint) -->
  <rect x="330" y="90" width="364" height="120" rx="36" fill="#A7F3D0" stroke="#1E1714" stroke-width="24" />

  <!-- Index Card Ruled Lines -->
  <line x1="220" y1="340" x2="804" y2="340" stroke="#1E1714" stroke-width="16" stroke-linecap="round" opacity="0.4" />
  
  <!-- Peach Highlighter Swath -->
  <rect x="210" y="440" width="560" height="54" rx="14" fill="#FED7AA" stroke="#1E1714" stroke-width="12" />
  <line x1="220" y1="467" x2="750" y2="467" stroke="#1E1714" stroke-width="16" stroke-linecap="round" opacity="0.8" />

  <line x1="220" y1="590" x2="804" y2="590" stroke="#1E1714" stroke-width="16" stroke-linecap="round" opacity="0.4" />
  <line x1="220" y1="710" x2="680" y2="710" stroke="#1E1714" stroke-width="16" stroke-linecap="round" opacity="0.4" />

  <!-- Playful Bro Pencil / Marker -->
  <g transform="translate(620, 600) rotate(-35)">
    <rect x="-40" y="-120" width="80" height="240" rx="16" fill="#BAE6FD" stroke="#1E1714" stroke-width="20" />
    <!-- Tip -->
    <polygon points="-40,120 40,120 0,180" fill="#FEF08A" stroke="#1E1714" stroke-width="20" stroke-linejoin="round" />
    <polygon points="-15,158 15,158 0,180" fill="#1E1714" />
    <!-- Eraser/Cap -->
    <rect x="-40" y="-160" width="80" height="40" rx="10" fill="#E9D5FF" stroke="#1E1714" stroke-width="20" />
  </g>
</svg>
